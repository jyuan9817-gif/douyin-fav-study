<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>导出 PDF</title>
<link rel="icon" type="image/svg+xml" href="/static/logo.svg">
<style>
  body { font: 14px/1.75 -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; color: #1d1d1f; max-width: 760px; margin: 24px auto; padding: 0 24px; }
  .tip { background: #e8f1fc; color: #0066cc; padding: 10px 14px; border-radius: 8px; margin-bottom: 20px; }
  article { page-break-after: always; }
  article:last-child { page-break-after: auto; }
  h1 { font: 700 26px/1.3 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; margin: 0 0 6px; }
  h2 { font-size: 16px; margin: 22px 0 8px; padding-bottom: 4px; border-bottom: 1px solid #e5e5ea; }
  .meta { color: #6e6e73; font-size: 12.5px; margin-bottom: 10px; }
  .summary { border-left: 3px solid #0071e3; padding: 6px 12px; background: #f5f5f7; }
  ul, ol { padding-left: 22px; margin: 0; }
  li { margin: 3px 0; }
  .kv b { margin-right: 6px; }
  .transcript { color: #424245; font-size: 12.5px; white-space: pre-wrap; }
  .mine { background: #f5f5f7; padding: 8px 12px; border-radius: 6px; white-space: pre-wrap; }
  @media print { .tip { display: none; } body { margin: 0 auto; } @page { margin: 16mm 14mm; } }
</style>
</head>
<body>
<div class="tip">在打印窗口里，「目标打印机」选择 <b>另存为 PDF / 存储为 PDF</b> 即可保存。如果没有自动弹出，按 Ctrl+P（Mac 按 ⌘+P）。
  <label style="margin-left:8px"><input type="checkbox" id="withTr"> 包含原文转录</label></div>
<div id="out">加载中…</div>
<script>
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ids = (new URLSearchParams(location.search).get("ids") || "").split(",").filter(Boolean);
let items = [];
function draw() {
  const withTr = document.getElementById("withTr").checked;
  document.getElementById("out").innerHTML = items.map((it) => {
    const n = it.note || {};
    const list = (arr, ord) => arr && arr.length ? `<${ord ? "ol" : "ul"}>${arr.map((x) => `<li>${x}</li>`).join("")}</${ord ? "ol" : "ul"}>` : "";
    const sec = (t, h) => h ? `<h2>${t}</h2>${h}` : "";
    return `<article>
      <h1>${esc(n.title || it.title)}</h1>
      <div class="meta">${esc(n.category || "")} ${n.difficulty ? "· " + esc(n.difficulty) : ""} ${it.author ? "· 作者：" + esc(it.author) : ""} ${it.url ? "· " + esc(it.url) : ""}</div>
      ${sec("一句话总结", n.summary ? `<div class="summary">${esc(n.summary)}</div>` : "")}
      ${sec("核心观点", list((n.points || []).map(esc), true))}
      ${sec("照着做", list((n.steps || []).map(esc), true))}
      ${sec("提到的工具", list((n.tools || []).map((t) => `<span class="kv"><b>${esc(t.name)}</b>${esc(t.use)}</span>`)))}
      ${sec("关键概念", list((n.concepts || []).map((t) => `<span class="kv"><b>${esc(t.term)}</b>${esc(t.explain)}</span>`)))}
      ${sec("自测题", list((n.quiz || []).map((q) => `${esc(q.q)}<br><span style="color:#248a3d">答：${esc(q.a)}</span>`), true))}
      ${sec("我的笔记", (it.my_note || "").trim() ? `<div class="mine">${esc(it.my_note)}</div>` : "")}
      ${withTr && it.transcript ? sec("原文转录", `<div class="transcript">${esc(it.transcript)}</div>`) : ""}
    </article>`;
  }).join("");
  document.title = items.length === 1 ? ((items[0].note || {}).title || items[0].title || "笔记") : `学习笔记（${items.length} 条）`;
}
document.getElementById("withTr").onchange = draw;
(async () => {
  items = (await Promise.all(ids.map((id) => fetch(`/api/items/${id}`).then((r) => r.json())))).filter((x) => x && !x.error);
  if (!items.length) { document.getElementById("out").textContent = "没有可导出的笔记"; return; }
  draw();
  setTimeout(() => window.print(), 400);
})();
</script>
</body>
</html>
