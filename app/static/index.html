<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI知识库</title>
<meta name="theme-color" content="#f5f5f7">
<link rel="icon" type="image/svg+xml" href="/static/logo.svg">
<link rel="apple-touch-icon" href="/static/logo.svg">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <div class="mark"><svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="lgside" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2c2c2e"/><stop offset="1" stop-color="#000"/></linearGradient></defs><rect width="64" height="64" rx="14.5" fill="url(#lgside)"/><path d="M32 24c-5-3.6-11.5-4.6-18-4v24.5c6.5-.6 13 .4 18 4z" fill="#fff"/><path d="M32 24c5-3.6 11.5-4.6 18-4v24.5c-6.5-.6-13 .4-18 4z" fill="#e8e8ed"/><path d="M32 7.5l2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z" fill="#ffcc00"/></svg></div>
      <div><div class="brand-name">AI知识库</div><div class="brand-sub">抖音收藏 → 学习笔记</div></div>
    </div>
    <nav class="nav">
      <a href="#/overview" data-nav="overview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>总览</a>
      <a href="#/process" data-nav="process"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>添加与处理 <span class="pill" id="navQueue" hidden></span></a>
      <a href="#/library" data-nav="library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a2 2 0 0 1 2-2h13v15H6a2 2 0 0 0-2 2z"/><path d="M4 19.5A2 2 0 0 0 6 21.5h13"/></svg>学习库</a>
      <div class="cats" id="navCats"></div>
      <a href="#/cards" data-nav="cards"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h12a2 2 0 0 1 2 2v12H6a2 2 0 0 1-2-2V5z"/><path d="M8 3h10a2 2 0 0 1 2 2v12"/></svg>知识卡片</a>
      <a href="#/distill" data-nav="distill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v6l4 7H8l4-7"/><path d="M8 20h8"/><path d="M9 16h6"/></svg>蒸馏与问答</a>
    </nav>
    <nav class="nav nav-bottom">
      <a href="#/settings" data-nav="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6 2.1 2.1M5.6 18.4l2.1-2.1m8.6-8.6 2.1-2.1"/><circle cx="12" cy="12" r="3.2"/></svg>设置</a>
    </nav>
    <div class="side-foot" id="sideStatus">就绪</div>
  </aside>

  <main class="main">
    <div class="job-banner" id="jobBanner" hidden></div>
    <div id="view"></div>
  </main>
</div>

<div class="modal" id="addModal" hidden>
  <div class="modal-card">
    <div class="modal-head"><h3>添加视频或图文</h3><button class="icon" data-close>✕</button></div>
    <p class="muted">在抖音里点「分享 → 复制链接」，把内容粘贴到下面。可以一次粘贴很多条，一行一条或混在一起都行。</p>
    <textarea id="addText" rows="7" placeholder="例如：7.89 复制打开抖音，看看【xxx的作品】这3个AI工具… https://v.douyin.com/xxxxxx/"></textarea>
    <div class="modal-foot">
      <a href="#/process" data-close class="link">更多方式：同步整个收藏夹 / 导入本地视频 →</a>
      <button class="btn primary" id="addSubmit">添加并开始处理</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
